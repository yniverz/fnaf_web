<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Five Nights at Freddy's - Web Recreation</title>
<meta name="description" content="A faithful fan recreation of the original Five Nights at Freddy's, written in pure JavaScript with code-generated art and audio. No downloads, no server.">

<body>
<div id="wrap">

    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script type="module" src="js/gl/index.js"></script>
</body>
</html>
